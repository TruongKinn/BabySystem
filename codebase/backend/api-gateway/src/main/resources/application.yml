      - name: Todo Service
        url: /todo/v3/api-docs

gateway:
  authorization:
    enabled: ${GATEWAY_AUTHORIZATION_ENABLED:true}
  rate-limit:
    replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
    burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
    requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

jwt:
  accessKey: ${JWT_ACCESS_KEY:c2VjcmV0QGtleS5hcGlfaGFzX2JlZW5fZGVzaWduZWRfYnlfVGF5TFE=}

