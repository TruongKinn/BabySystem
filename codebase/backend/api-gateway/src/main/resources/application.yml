server:
  port: 4953

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
      default-filters:
        - name: Retry
          args:
            retries: ${GATEWAY_RETRY_ATTEMPTS:2}
            methods:
              - GET
              - HEAD
            statuses:
              - BAD_GATEWAY
              - SERVICE_UNAVAILABLE
              - GATEWAY_TIMEOUT
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_LAST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${GATEWAY_ALLOWED_ORIGIN:http://localhost:4200}
            allowedMethods:
              - GET
              - HEAD
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Route cho authentication-service
        - id: authentication-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: authenticationServiceGateway
                fallbackUri: forward:/gateway/fallback/authentication-service

        - id: account-service
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/account/**
          filters:
            - RewritePath=/account/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: accountServiceGateway
                fallbackUri: forward:/gateway/fallback/account-service

        - id: expense-service
          uri: ${EXPENSE_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/expense/**
          filters:
            - RewritePath=/expense/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: expenseServiceGateway
                fallbackUri: forward:/gateway/fallback/expense-service

        - id: meal-service
          uri: ${MEAL_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/meal/**
          filters:
            - RewritePath=/meal/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: mealServiceGateway
                fallbackUri: forward:/gateway/fallback/meal-service

        - id: task-service
          uri: ${TASK_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/task/**
          filters:
            - RewritePath=/task/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: taskServiceGateway
                fallbackUri: forward:/gateway/fallback/task-service

        - id: baby-service
          uri: ${BABY_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/baby/**
          filters:
            - RewritePath=/baby/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: babyServiceGateway
                fallbackUri: forward:/gateway/fallback/baby-service

        - id: shopping-service
          uri: ${SHOPPING_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/shopping/**
          filters:
            - RewritePath=/shopping/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: shoppingServiceGateway
                fallbackUri: forward:/gateway/fallback/shopping-service

        - id: insight-service
          uri: ${INSIGHT_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/insight/**
          filters:
            - RewritePath=/insight/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: insightServiceGateway
                fallbackUri: forward:/gateway/fallback/insight-service

        - id: file-service
          uri: ${FILE_SERVICE_URI:http://localhost:8092}
          predicates:
            - Path=/file/**
          filters:
            - RewritePath=/file/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: fileServiceGateway
                fallbackUri: forward:/gateway/fallback/file-service
            
        # Route cho logistics-service (Orchestrator)
        - id: logistics-service
          uri: ${LOGISTICS_SERVICE_URI:http://localhost:8093}
          predicates:
            - Path=/logistics/**
          filters:
            - name: CircuitBreaker
              args:
                name: logisticsServiceGateway
                fallbackUri: forward:/gateway/fallback/logistics-service

        # Route cho frontend orchestrator page
        - id: orchestrator-service
          uri: ${LOGISTICS_SERVICE_URI:http://localhost:8093}
          predicates:
            - Path=/orchestrator/**
          filters:
            - name: CircuitBreaker
              args:
                name: orchestratorGateway
                fallbackUri: forward:/gateway/fallback/orchestrator-service
            
        # Route cho shipment-service
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URI:http://localhost:8094}
          predicates:
            - Path=/shipment/**
          filters:
            - name: CircuitBreaker
              args:
                name: shipmentServiceGateway
                fallbackUri: forward:/gateway/fallback/shipment-service
            
        # Route cho tracking-service
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URI:http://localhost:8095}
          predicates:
            - Path=/tracking/**
          filters:
            - name: CircuitBreaker
              args:
                name: trackingServiceGateway
                fallbackUri: forward:/gateway/fallback/tracking-service
            
        # Route cho driver-service
        - id: driver-service
          uri: ${DRIVER_SERVICE_URI:http://localhost:8096}
          predicates:
            - Path=/driver/**
          filters:
            - name: CircuitBreaker
              args:
                name: driverServiceGateway
                fallbackUri: forward:/gateway/fallback/driver-service
            
        # Route cho vehicle-service
        - id: vehicle-service
          uri: ${VEHICLE_SERVICE_URI:http://localhost:8097}
          predicates:
            - Path=/vehicle/**
          filters:
            - name: CircuitBreaker
              args:
                name: vehicleServiceGateway
                fallbackUri: forward:/gateway/fallback/vehicle-service

        # Route cho batch-job
        - id: batch-job
          uri: ${BATCH_JOB_URI:http://localhost:8091}
          predicates:
            - Path=/batch-job/**
          filters:
            - RewritePath=/batch-job/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: batchJobGateway
                fallbackUri: forward:/gateway/fallback/batch-job

        # Route cho job-supervisor
        - id: job-supervisor
          uri: ${JOB_SUPERVISOR_URI:http://localhost:8090}
          predicates:
            - Path=/job-supervisor/**
          filters:
            - RewritePath=/job-supervisor/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: jobSupervisorGateway
                fallbackUri: forward:/gateway/fallback/job-supervisor

        # Route cho notification REST APIs
        - id: notification-service-http
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8098}
          predicates:
            - Path=/notification/api/**
          filters:
            - RewritePath=/notification/api/(?<segment>.*), /api/$\{segment}
            - name: CircuitBreaker
              args:
                name: notificationServiceGateway
                fallbackUri: forward:/gateway/fallback/notification-service

        - id: finance-service
          uri: ${FINANCE_SERVICE_URI:http://localhost:8103}
          predicates:
            - Path=/finance/**
          filters:
            - RewritePath=/finance/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: financeServiceGateway
                fallbackUri: forward:/gateway/fallback/finance-service

        - id: todo-service
          uri: ${TODO_SERVICE_URI:http://localhost:8102}
          predicates:
            - Path=/todo/**
          filters:
            - RewritePath=/todo/(?<segment>.*), /$\{segment}
            - name: CircuitBreaker
              args:
                name: todoServiceGateway
                fallbackUri: forward:/gateway/fallback/todo-service

        # Route cho common-service OpenAPI docs
        - id: common-service-docs
          uri: ${COMMON_SERVICE_URI:http://localhost:8099}
          predicates:
            - Path=/common/v3/api-docs
          filters:
            - RewritePath=/common/v3/api-docs, /v3/api-docs
            - name: CircuitBreaker
              args:
                name: commonServiceDocsGateway
                fallbackUri: forward:/gateway/fallback/common-service

        # Route cho common-service
        - id: common-service
          uri: ${COMMON_SERVICE_URI:http://localhost:8099}
          predicates:
            - Path=/common/**
          metadata:
            response-timeout: 30000
          filters:
            - name: CircuitBreaker
              args:
                name: commonServiceGateway
                fallbackUri: forward:/gateway/fallback/common-service

        # Route cho notification WebSocket/SockJS endpoint
        - id: notification-service-ws
          uri: ${NOTIFICATION_SERVICE_WS_URI:ws://localhost:8098}
          predicates:
            - Path=/notification/ws/**
            
# OpenAPI Aggregation (Swagger)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Driver Service
        url: /driver/v3/api-docs
