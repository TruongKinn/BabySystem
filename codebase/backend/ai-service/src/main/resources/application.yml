spring:
  application:
    name: ai-service

server:
  port: ${PORT:8104}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gemini-3.5-flash}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  responses-path: ${OPENAI_RESPONSES_PATH:/v1/responses}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:900}
  timeout: ${OPENAI_TIMEOUT:45s}

logging:
  level:
    com.mom.ai: info
