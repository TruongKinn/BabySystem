services:
  postgres:
    image: postgres:16-alpine
    container_name: mom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: mom-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: mom-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: mom-kafka-init
    depends_on:
      - kafka
    volumes:
      - ./kafka:/scripts
    command: >
      sh -c "
      until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1;
      do
        echo 'Waiting for kafka...';
        sleep 2;
      done;
      KAFKA_BOOTSTRAP_SERVER=kafka:29092 sh /scripts/create-topics.sh
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: mom-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: mom-debezium-connect
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    ports:
      - "8094:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: mom-debezium-connect
      CONFIG_STORAGE_TOPIC: debezium.connect.configs
      OFFSET_STORAGE_TOPIC: debezium.connect.offsets
      STATUS_STORAGE_TOPIC: debezium.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  debezium-init:
    image: curlimages/curl:8.11.1
    container_name: mom-debezium-init
    depends_on:
      - debezium-connect
    volumes:
      - ./debezium:/debezium:ro
    command: >
      sh -c "
      until curl -fsS http://debezium-connect:8083/connectors >/dev/null;
      do
        echo 'Waiting for Debezium Connect...';
        sleep 2;
      done;
      curl -fsS -X PUT -H 'Content-Type: application/json' --data @/debezium/expense-outbox-connector.json http://debezium-connect:8083/connectors/expense-outbox-connector/config;
      echo 'Debezium expense outbox connector registered.'
      "

  vault:
    image: hashicorp/vault:1.16
    container_name: mom-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: 'http://127.0.0.1:8200'
      VAULT_API_ADDR: 'http://127.0.0.1:8200'
    command: vault server -config=/vault/config/vault.hcl
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/data
      - vault_logs:/vault/logs

  vault-unseal:
    image: alpine:3.18
    container_name: mom-vault-unseal
    depends_on:
      - vault
    restart: always
    volumes:
      - ./vault:/vault:ro
    command: |
      sh -c '
      apk add --no-cache curl jq >/dev/null 2>&1;
      
      echo "Chờ dịch vụ Vault trực tuyến...";
      until curl -fsS http://vault:8200/v1/sys/health >/dev/null 2>&1;
      do
        sleep 2;
      done;
      
      KEYS_FILE="/vault/cluster-keys.json"
      if [ -f "$$KEYS_FILE" ]; then
        echo "Tìm thấy cluster-keys.json. Đang tự động mở khóa Vault (Unsealing)...";
        
        KEY1=$$(jq -r ".unseal_keys_b64[0]" "$$KEYS_FILE")
        KEY2=$$(jq -r ".unseal_keys_b64[1]" "$$KEYS_FILE")
        KEY3=$$(jq -r ".unseal_keys_b64[2]" "$$KEYS_FILE")
        
        curl -fsS -X POST -H "Content-Type: application/json" -d "{\"key\": \"$$KEY1\"}" http://vault:8200/v1/sys/unseal >/dev/null
        curl -fsS -X POST -H "Content-Type: application/json" -d "{\"key\": \"$$KEY2\"}" http://vault:8200/v1/sys/unseal >/dev/null
        curl -fsS -X POST -H "Content-Type: application/json" -d "{\"key\": \"$$KEY3\"}" http://vault:8200/v1/sys/unseal >/dev/null
        
        echo "Vault đã được mở khóa tự động thành công!"
      else
        echo "LỖI: Không tìm thấy tệp tin cluster-keys.json tại /vault/cluster-keys.json để unseal tự động."
      fi
      '

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: mom-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: mom-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes

volumes:
  postgres_data:
  redis_data:
  vault_data:
  vault_logs:
  minio_data:
  keycloak_data:
