<nav class="navbar" role="navigation" aria-label="Điều hướng chính">
  <div class="navbar-inner">

    <!-- Brand -->
    <div class="navbar-left">
      <a class="brand-logo" routerLink="/guest/home" [attr.aria-label]="'guest.common.brand' | translate">
        <span class="brand-heart">🌸</span>
        {{ 'guest.common.brand' | translate }}
      </a>

      <!-- Desktop Nav Links using nz-menu -->
      <ul nz-menu nzMode="horizontal" class="nav-links-menu hidden-mobile-menu">
        <li
          nz-menu-item
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="ant-menu-item-selected"
          [routerLinkActiveOptions]="{ exact: item.route === '/guest/home' }"
        >
          {{ item.label | translate }}
        </li>
      </ul>
    </div>

    <!-- Actions -->
    <div class="nav-actions">
      <!-- Ant Design Button Icon -->
      <button nz-button nzType="text" nzShape="circle" class="btn-icon-antd" [attr.aria-label]="'guest.common.navbar.search' | translate">
        <span class="material-symbols-outlined">search</span>
      </button>

      <!-- Ant Design Button Login -->
      <button nz-button nzType="primary" nzShape="round" class="btn-login-antd" (click)="navigateToLogin()" id="navbar-btn-login">
        {{ 'guest.common.navbar.login' | translate }}
      </button>

      <!-- Mobile Menu Trigger -->
      <button
        nz-button
        nzType="text"
        nzShape="circle"
        class="btn-icon-antd btn-menu-antd"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        [attr.aria-label]="'guest.common.navbar.menu' | translate"
      >
        <span class="material-symbols-outlined">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
      </button>
    </div>

  </div>

  <!-- Mobile Nav Links using nz-menu overlay -->
  <div class="mobile-menu-overlay" *ngIf="isMobileMenuOpen">
    <ul nz-menu nzMode="inline" class="nav-links-menu-mobile">
      <li
        nz-menu-item
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="ant-menu-item-selected"
        [routerLinkActiveOptions]="{ exact: item.route === '/guest/home' }"
        (click)="isMobileMenuOpen = false"
      >
        {{ item.label | translate }}
      </li>
    </ul>
  </div>
</nav>
