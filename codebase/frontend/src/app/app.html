<div class="app-shell" *ngIf="showLayout; else authLayout">

  <!-- MetisMenu Sidebar -->
  <app-sidebar
    [isDarkMode]="isDarkMode"
    [username]="username"
    [userInitials]="userInitials"
    [avatarUrl]="avatarUrl"
  ></app-sidebar>



  <!-- Main area -->
  <div class="main-area">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
      </div>

      <div class="header-right">
        <!-- Language switcher -->
        <div class="lang-switcher">
          <button
            *ngFor="let lang of languageOptions"
            class="lang-btn"
            [class.active]="currentLanguage === lang.code"
            (click)="setLanguage(lang.code)"
          >{{ lang.shortLabel }}</button>
        </div>

        <!-- Theme toggle -->
        <button class="theme-toggle-btn" (click)="toggleTheme()" [attr.title]="'momApp.layout.toggleTheme' | translate">
          <svg *ngIf="!isDarkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg *ngIf="isDarkMode" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <!-- User info -->
        <div class="header-user-info" nz-popover [nzPopoverContent]="logoutTemplate" nzPopoverPlacement="bottomRight" nzPopoverTrigger="hover">
          <nz-avatar
            [nzSrc]="avatarUrl"
            [nzText]="userInitials"
            [nzSize]="32"
            [nzIcon]="'user'"
          ></nz-avatar>
          <span class="header-username">{{ 'momApp.layout.hello' | translate }}, <strong>{{ username }}</strong></span>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Logout popover -->
<ng-template #logoutTemplate>
  <div class="logout-popover-content">
    <div class="popover-user-info">
      <strong>{{ username }}</strong>
      <span>{{ 'momApp.layout.authenticatedSession' | translate }}</span>
    </div>
    <nz-divider style="margin: 8px 0"></nz-divider>
    <div class="logout-action" (click)="logout()">
      <span nz-icon nzType="logout"></span>
      <span>{{ 'momApp.layout.logout' | translate }}</span>
    </div>
  </div>
</ng-template>

<!-- Auth layout (unauthenticated) -->
<ng-template #authLayout>
  <div class="auth-wrapper">
    <router-outlet></router-outlet>
  </div>
</ng-template>
